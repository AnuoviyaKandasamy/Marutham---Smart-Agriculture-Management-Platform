<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Marutham</title>
    <link rel="stylesheet" href="css/style.css?v=12.0.5">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-shell">
        <aside class="sidebar-v2">
            <div class="sidebar-header">
                <a href="index.html" style="text-decoration:none; display:flex; align-items:center; gap:12px;">
                    <div style="background:var(--primary); color:white; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);">
                        <i data-lucide="leaf" style="width:22px; height:22px;"></i>
                    </div>
                    <span style="font-weight:800; color:var(--bg-dark); font-size:1.5rem; letter-spacing:-1px;">Marutham</span>
                </a>
            </div>
            <nav class="nav-group" style="flex:1; margin-top: 2rem;">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard" style="width:20px; height:20px;"></i>
                    <span data-i18n="dash_nav_dashboard">Dashboard</span>
                </a>
                <a href="marketplace.html" class="nav-item active">
                    <i data-lucide="shopping-cart" style="width:20px; height:20px;"></i>
                    <span data-i18n="nav_marketplace">Produce Marketplace</span>
                </a>
                <a href="forum.html" class="nav-item">
                    <i data-lucide="message-square" style="width:20px; height:20px;"></i>
                    <span data-i18n="dash_nav_forum">Community Forum</span>
                </a>
                <a href="prices.html" class="nav-item">
                    <i data-lucide="line-chart" style="width:20px; height:20px;"></i>
                    <span data-i18n="dash_nav_prices">Market Prices</span>
                </a>
            </nav>
            <div style="padding: 2rem; border-top:1px solid var(--border);">
                <select id="lang-switcher" style="width:100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 1rem;">
                    <option value="en">English</option>
                    <option value="ta">தமிழ்</option>
                </select>
                <a href="logout" class="nav-item"><i data-lucide="log-out"></i><span data-i18n="dash_nav_signout">Sign Out</span></a>
            </div>
        </aside>

        <main class="main-content-v2">
            <div class="top-nav">
                <h1 style="font-size:1.75rem; font-weight:800; color:var(--bg-dark);" data-i18n="marketplace_title">Farmer's Marketplace</h1>
                <button id="addProduceBtn" class="btn btn-primary" style="display:none;" onclick="document.getElementById('modal').style.display='flex'">
                    <i data-lucide="plus" style="width:18px; height:18px;"></i>
                    <span data-i18n="add_produce">List Produce</span>
                </button>
            </div>

            <div class="content-body">
                <p style="color:var(--text-muted); margin-bottom:2rem;" data-i18n="marketplace_subtitle">Direct farm-to-table commerce platform.</p>
                <div id="produceList" class="card-grid">
                </div>
            </div>
        </main>
    </div>

    <div id="modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
        <div class="card-v2" style="width:500px; max-width:90%;">
            <h2 style="margin-bottom:1.5rem;" data-i18n="add_produce">List Produce</h2>
            <form id="produceForm" style="display:flex; flex-direction:column; gap:1rem;">
                <input type="text" name="cropName" data-i18n="price_request_crop" placeholder="Crop Name" required style="padding:0.75rem; border-radius:8px; border:1px solid var(--border);">
                <input type="text" name="quantity" data-i18n="quantity" placeholder="Quantity (e.g. 500 kg)" required style="padding:0.75rem; border-radius:8px; border:1px solid var(--border);">
                <input type="number" name="priceExpected" data-i18n="expected_price" placeholder="Expected Price (per kg)" required style="padding:0.75rem; border-radius:8px; border:1px solid var(--border);">
                <input type="text" name="location" placeholder="Location" data-i18n="label_location" required style="padding:0.75rem; border-radius:8px; border:1px solid var(--border);">
                <input type="text" name="contactNumber" placeholder="Contact Number" data-i18n="label_contact" required style="padding:0.75rem; border-radius:8px; border:1px solid var(--border);">
                <textarea name="description" placeholder="Description" data-i18n="label_description" style="padding:0.75rem; border-radius:8px; border:1px solid var(--border); height:100px;"></textarea>
                <div style="display:flex; gap:1rem;">
                    <button type="submit" class="btn btn-primary" style="flex:1;" data-i18n="btn_submit">Submit</button>
                    <button type="button" class="btn btn-outline" style="flex:1;" onclick="document.getElementById('modal').style.display='none'" data-i18n="btn_cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            Api.get('login').then(data => {
                if (data && data.loggedIn) {
                    if (data.user.role === 'FARMER') document.getElementById('addProduceBtn').style.display = 'flex';
                    loadMarketplace();
                } else {
                    window.location.href = 'login.html';
                }
            });

            function loadMarketplace() {
                Api.get('marketplace').then(data => {
                    const list = document.getElementById('produceList');
                    if (!data || data.length === 0) {
                        list.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:3rem; color:var(--text-muted);">No items listed yet.</p>`;
                        return;
                    }
                    list.innerHTML = data.map(item => `
                        <div class="card-v2">
                            <div style="background:var(--primary-light); color:var(--primary); padding:1rem; border-radius:12px; margin-bottom:1rem; font-weight:800; text-align:center;">
                                ${item.cropName}
                            </div>
                            <h3 style="margin-bottom:0.5rem;">${item.quantity}</h3>
                            <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">${item.description || 'No description provided'}</p>
                            <div style="border-top:1px solid var(--border); padding-top:1rem; font-size:0.85rem;">
                                <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                                    <span data-i18n="expected_price">Price</span>: <span style="font-weight:700; color:var(--bg-dark);">₹${item.priceExpected}/kg</span>
                                </div>
                                <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                                    <span data-i18n="role_farmer">Farmer</span>: <span>${item.farmerName}</span>
                                </div>
                                <div style="display:flex; justify-content:space-between;">
                                    <span data-i18n="label_location">Location</span>: <span>${item.location}</span>
                                </div>
                            </div>
                            <a href="tel:${item.contactNumber}" class="btn btn-outline" style="width:100%; margin-top:1.5rem; text-align:center; text-decoration:none; display:inline-block;">
                                <i data-lucide="phone-call" style="width:16px; height:16px; vertical-align:middle; margin-right:8px;"></i> Contact
                            </a>
                        </div>
                    `).join('');


                    I18n.applyLanguage(I18n.currentLang);
                    lucide.createIcons();
                });
            }

            document.getElementById('produceForm').onsubmit = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const params = new URLSearchParams(formData).toString();

                Api.post('marketplace', params).then(res => {
                    App.UI.showToast("Listing added successfully!", "success");
                    document.getElementById('modal').style.display = 'none';
                    loadMarketplace();
                }).catch(err => {
                    App.UI.showToast("Failed to add listing.", "error");
                });
            };
        });
    </script>
</body>
</html>
