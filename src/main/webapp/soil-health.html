<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soil Health | Marutham</title>
    <link rel="stylesheet" href="css/style.css?v=12.0.5">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .param-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .param-item { background: var(--bg-alt); padding: 8px; border-radius: 8px; text-align: center; }
        .param-label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 2px; }
        .param-value { font-weight: 700; color: var(--bg-dark); }
        .recommendation-box { margin-top: 15px; padding: 12px; background: var(--primary-light); border-left: 4px solid var(--primary); border-radius: 4px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="dashboard-shell">
        <aside class="sidebar-v2">
            <div class="sidebar-header">
                <a href="index.html" style="text-decoration:none; display:flex; align-items:center; gap:12px;">
                    <div style="background:var(--primary); color:white; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;">
                        <i data-lucide="leaf" style="width:22px; height:22px;"></i>
                    </div>
                    <span style="font-weight:800; color:var(--bg-dark); font-size:1.5rem;">Marutham</span>
                </a>
            </div>
            <nav class="nav-group" style="flex:1; margin-top: 2rem;">
                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard"></i>
                    <span data-i18n="dash_nav_dashboard">Dashboard</span>
                </a>
                <a href="soil-health.html" class="nav-item active">
                    <i data-lucide="flask-conical"></i>
                    <span data-i18n="nav_soil_health">Soil Health</span>
                </a>
                <a href="marketplace.html" class="nav-item">
                    <i data-lucide="shopping-cart"></i>
                    <span data-i18n="nav_marketplace">Produce Marketplace</span>
                </a>
            </nav>
            <div style="padding: 2rem; border-top:1px solid var(--border);">
                <div style="margin-bottom: 1.5rem;">
                    <select id="lang-switcher" style="width:100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-alt); font-weight: 600; font-family: inherit; cursor: pointer;">
                        <option value="en">English</option>
                        <option value="ta">தமிழ்</option>
                    </select>
                </div>
                <a href="logout" class="nav-item"><i data-lucide="log-out"></i><span data-i18n="dash_nav_signout">Sign Out</span></a>
            </div>
        </aside>

        <main class="main-content-v2">
            <div class="top-nav">
                <h1 style="font-size:1.75rem; font-weight:800; color:var(--bg-dark);" data-i18n="soil_health_title">Soil Health Record</h1>
                <button class="btn btn-primary" onclick="document.getElementById('soilModal').style.display='flex'">
                    <i data-lucide="plus"></i>
                    <span data-i18n="btn_submit">Add Report</span>
                </button>
            </div>

            <div class="content-body">
                <p style="color:var(--text-muted); margin-bottom:2rem;" data-i18n="soil_health_subtitle">Track soil nutrition and get expert guidance.</p>
                <div id="soilReportList" class="card-grid">
                    <!-- Reports will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Soil Health Entry -->
    <div id="soilModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
        <div class="card-v2" style="width:600px; max-width:95%; overflow-y:auto; max-height:90vh;">
            <h2 style="margin-bottom:1.5rem;" data-i18n="soil_health_title">Add Soil Report</h2>
            <form id="soilForm" style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
                <div style="grid-column: 1 / -1;">
                    <label data-i18n="soil_type">Soil Type</label>
                    <select name="soilType" style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid var(--border);">
                        <option value="Clay">Clay</option>
                        <option value="Sandy">Sandy</option>
                        <option value="Loamy">Loamy</option>
                        <option value="Black">Black</option>
                        <option value="Red">Red</option>
                    </select>
                </div>
                <div>
                    <label data-i18n="ph_level">pH Level</label>
                    <input type="number" step="0.1" name="phLevel" placeholder="e.g. 6.5" style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid var(--border);">
                </div>
                <div>
                    <label data-i18n="nitrogen">Nitrogen</label>
                    <select name="nitrogen" style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid var(--border);">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div>
                    <label data-i18n="phosphorus">Phosphorus</label>
                    <select name="phosphorus" style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid var(--border);">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div>
                    <label data-i18n="potassium">Potassium</label>
                    <select name="potassium" style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid var(--border);">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div style="grid-column: 1 / -1;">
                    <label data-i18n="organic_carbon">Organic Carbon</label>
                    <input type="text" name="organicCarbon" placeholder="e.g. 0.5%" style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid var(--border);">
                </div>
                <div style="grid-column: 1 / -1; display:flex; gap:1rem; margin-top:1rem;">
                    <button type="submit" class="btn btn-primary" style="flex:1;" data-i18n="btn_submit">Save Report</button>
                    <button type="button" class="btn btn-outline" style="flex:1;" onclick="document.getElementById('soilModal').style.display='none'" data-i18n="btn_cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            Api.get('login').then(data => {
                if (data && data.loggedIn) {
                    loadSoilReports();
                } else {
                    window.location.href = 'login.html';
                }
            });

            function loadSoilReports() {
                Api.get('soil-health').then(data => {
                    const list = document.getElementById('soilReportList');
                    if (!data || data.length === 0) {
                        list.innerHTML = `<p style="grid-column:1/-1; text-align:center; padding:3rem; color:var(--text-muted);">No reports added yet.</p>`;
                        return;
                    }
                    list.innerHTML = data.map(report => `
                        <div class="card-v2">
                            <div class="flex-between" style="margin-bottom:1rem;">
                                <span style="font-weight:800; color:var(--primary);">${report.soilType} <span data-i18n="soil_type">Soil</span></span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">${new Date(report.createdAt).toLocaleDateString()}</span>
                            </div>
                            <div class="param-grid">
                                <div class="param-item"><span class="param-label" data-i18n="ph_level">pH</span><span class="param-value">${report.phLevel || '--'}</span></div>
                                <div class="param-item"><span class="param-label" data-i18n="nitrogen">N</span><span class="param-value">${report.nitrogenContent}</span></div>
                                <div class="param-item"><span class="param-label" data-i18n="phosphorus">P</span><span class="param-value">${report.phosphorusContent}</span></div>
                                <div class="param-item"><span class="param-label" data-i18n="potassium">K</span><span class="param-value">${report.potassiumContent}</span></div>
                            </div>
                            <div class="recommendation-box">
                                <strong data-i18n="dash_expert_advisory">Recommendation</strong>:<br>
                                ${report.recommendation}
                            </div>
                        </div>
                    `).join('');

                    // Apply translation for dynamic content
                    I18n.applyLanguage(I18n.currentLang);
                    lucide.createIcons();
                });
            }

            document.getElementById('soilForm').onsubmit = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const params = new URLSearchParams(formData).toString();

                Api.post('soil-health', params).then(res => {
                    App.UI.showToast("Soil report saved!", "success");
                    document.getElementById('soilModal').style.display = 'none';
                    loadSoilReports();
                }).catch(err => {
                    App.UI.showToast("Failed to save report.", "error");
                });
            };
        });
    </script>
</body>
</html>
